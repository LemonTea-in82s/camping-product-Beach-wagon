<body><main class="article"><a class="back" href="index.html#support">← 返回评审目录</a><header class="hero"><div><div class="project">项目31 / 美国站</div><h1>浏览与使用关注点</h1><p class="subtitle">选购与使用中需要验证的任务</p></div></header><article class="article-body"><p>浏览：轮组、有效装载长度、容量、价格、是否尾开、含轮收纳。</p>
<p>使用：长物固定、尾门支撑锁止、软沙拉力与转向、含沙湿布收展、独立搬抬装车、清洁维护。</p>
<p>优先尾开长物方案，但必须对照Navatiee、Strolking、Aisdan的好用个案；难收折、轮组卡擦、尾门滑移要分别定位，不能统称尾开卡顿。</p>
